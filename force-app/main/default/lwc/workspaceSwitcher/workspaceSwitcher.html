<template>
    <section class="workspace-switcher slds-p-around_small" aria-label="Switch Salesforce workspace">
        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
            <lightning-icon icon-name="utility:apps" size="x-small" alternative-text="Workspaces" class="slds-m-right_x-small"></lightning-icon>
            <span class="slds-text-title_bold">Switch Workspace</span>
        </div>
        <lightning-combobox
            name="workspace"
            label="Application"
            value={currentApp}
            options={appOptions}
            onchange={handleChange}
            variant="label-stacked">
        </lightning-combobox>
        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
            Switch between Fitness Hub and Campus Events without changing orgs.
        </p>
    </section>
</template>
